# pi-mono in System4D terms.
# A softwareco fork-lane repo, the local home for post-upstream DSPY work on pi-mono: a fork control plane committed on top of an upstream pi-mono tree, with import and sync still undecided.
# Written for the agents that work in and beside this repo: read it before
# changing what the repo does or how. README.md, AGENTS.md and docs/project/
# hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "pi-mono (softwareco fork)"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "The fork rationale and upstream boundary: why post-upstream DSPY work lives here instead of in requests to badlogic/pi-mono (docs/decisions/2026-03-13-fork-bootstrap-and-upstream-boundary.md)"
          - "The upstream import and sync policy for badlogic/pi-mono: mirror import, filtered import or another seed strategy, sync cadence and merge/rebase posture (governance/work-items.json I2)"
          - "A repo-local queue translated from the abandoned upstream DSPY asks, then the first bounded implementation slice (I3, I4)"
          - "Later, DSPY-like compile, eval, replay and optimization work on the fork (docs/project/vision.md)"
          - "The fork control plane: AGENTS.md, docs/, governance/, ontology/, scripts/rocs.sh and scripts/ci/smoke.sh and full.sh"
        out_of_scope:
          - "Pursuing DSPY work as upstream requests to badlogic/pi-mono: the fork ADR closed that line, and stale upstream issue text is not repo-local authority (AGENTS.md)"
          - "Divergence on the upstream code before an accepted import/sync decision (AGENTS.md, docs/system4d/engine.md)"
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it for registered repos, and this repo is registered; docs and governance/work-items.json are projections (workspace AGENTS.md)"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
      constraints:
        - "Primary language: typescript (.copier-answers.yml); the tracked upstream tree is an npm workspaces monorepo (package.json, packages/)"
        - "Lane placement stays truthful: a softwareco/fork repo, not owned/ or contrib/ (docs/system4d/container.md)"
        - "No secrets in git; never push to main, merge requests only; docs/_core/** is immutable (AGENTS.md)"
        - "No upstream code import or large divergence without an explicit import/sync decision (AGENTS.md)"
      edges:
        - name: "Upstream reference"
          direction: "in"
          protocol: "git"
          system: "badlogic/pi-mono; the tracked packages publish as @earendil-works/pi-*"
          contract: "docs/decisions/2026-03-13-fork-bootstrap-and-upstream-boundary.md (import/sync posture still open)"
        - name: "Fork remote"
          direction: "bi"
          protocol: "git"
          system: "tryingET/pi-mono on GitHub (origin, the only configured remote)"
          contract: "AGENTS.md: never push to main; merge requests only"
        - name: "Former upstream DSPY asks"
          direction: "in"
          protocol: "file"
          system: "softwareco/infra/issue-tracker, where the abandoned DSPY asks to badlogic/pi-mono were drafted"
          contract: "docs/system4d/fog.md; governance/work-items.json I3"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "The repo is registered in AK; its only AK task so far (300) is done"
        - name: "core/ontology-kernel and softwareco/ontology"
          type: "build"
          note: "The core and company ontology layers in ontology/manifest.yaml; the committed manifest still names the retired gitlab:org refs at v0.1.0, the uncommitted worktree names the repo: refs"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh; the committed tree vendors tools/rocs-cli, the uncommitted worktree deletes it and runs the workspace core checkout"
      anti_goals:
        - "A blind code dump from upstream (README.md)"
        - "Hidden divergence without a recorded decision (docs/project/purpose.md)"
        - "Treating this repo as a mirror of upstream issues (docs/system4d/container.md)"
        - "Large speculative roadmap dumps instead of bounded slices (docs/system4d/container.md)"
    compass:
      drivers:
        - "DSPY-related work is no longer pursued through badlogic/pi-mono upstream requests; without a concrete fork repo that decision would stay rhetorical (fork ADR)"
      outcomes:
        - "A governed local fork where DSPY-like compile, eval, replay and optimization capabilities evolve with explicit evidence and without recurring upstream scope friction (docs/project/vision.md)"
        - "Upstream import/sync posture is explicit, and the former upstream DSPY asks are repo-local executable work (docs/system4d/compass.md)"
      tradeoffs:
        - decision: "How to bootstrap the fork"
          chosen: "The company tpl-project-repo control-plane scaffold, normalized to the fork lane, with the code import decision deferred"
          because: "It gave the fork a concrete home, a work queue and a recorded rationale at once (fork ADR)"
    engine:
      triggers:
        - "The operator takes up the import/sync decision (governance/work-items.json I2)"
        - "A DSPY follow-up slice is chosen from the translated upstream asks (I3, I4)"
      states:
        - name: "bootstrap"
          meaning: "Control plane and fork rationale exist; import/sync posture undecided; no local divergence (current)"
        - name: "sync posture decided"
          meaning: "An accepted repo-local decision says how upstream code enters, how syncs run, and what evidence divergence needs (I2 definition of done)"
        - name: "diverging"
          meaning: "Local DSPY work lands on the imported code, each major divergence pointing to a repo-local decision (docs/project/strategic_goals.md)"
      invariants:
        - id: "PIM-INV-001"
          statement: "The repo always explains why the fork exists"
          enforcement: "policy: docs/decisions/2026-03-13-fork-bootstrap-and-upstream-boundary.md, docs/system4d/engine.md"
        - id: "PIM-INV-002"
          statement: "Repo-local decisions outrank stale upstream proposal context once the fork path is chosen"
          enforcement: "policy: AGENTS.md, docs/system4d/engine.md"
        - id: "PIM-INV-003"
          statement: "Upstream import/sync behavior is explicit before substantial code divergence begins"
          enforcement: "policy: AGENTS.md, docs/system4d/engine.md"
      lifecycle:
        - "Decide how badlogic/pi-mono enters the fork and record it in docs/decisions/"
        - "Translate the abandoned upstream DSPY asks into repo-local capability buckets with a first slice"
        - "Define validation expectations for that slice before code work begins"
        - "Land the slice on the imported code under its repo-local decision"
    fog:
      assumptions:
        - id: "PIM-A-001"
          statement: "Fork-lane use is intentional and long-lived (next_session_prompt.md)"
          how_to_validate: "The import/sync decision restates it, or the operator retires the fork"
        - id: "PIM-A-002"
          statement: "The issue-tracker DSPY bodies remain the planning input for the local queue (next_session_prompt.md)"
          how_to_validate: "Check each ask against the current upstream tree while translating it (I3)"
      risks:
        - id: "PIM-R-001"
          statement: "The import/sync posture stays undecided, so code work drifts"
          mitigation: "I2 is the next bounded slice in next_session_prompt.md"
        - id: "PIM-R-002"
          statement: "The DSPY backlog lives mostly in issue-tracker artifacts; left untranslated, the intent fragments again"
          mitigation: "I3 translates it into repo-local work"
        - id: "PIM-R-003"
          statement: "The normalized tpl-project-repo control plane may need restructuring once upstream code lands"
          mitigation: "Accepted as debt in the fork ADR; revisit with the import/sync decision"
      exceptions:
        - id: "PIM-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "PIM-D-001"
          statement: "README.md, AGENTS.md, next_session_prompt.md and docs/tech-stack.local.md say no upstream code is imported, but the tracked tree is upstream pi-mono at b1efcf7d7 (2026-08-14) under packages/, with control-plane commit 1f0ecdcb7 on top and no import decision recorded"
          payoff_plan: "Record the I2 import/sync decision, then make the docs say what the tree holds"
        - id: "PIM-D-002"
          statement: "Done AK task 300 left its changes uncommitted in the worktree: manifest refs moved from gitlab:org to repo:, tools/rocs-cli deleted, scripts/rocs.sh, scripts/ci/full.sh and governance/work-items.json rewritten, an ak direction section added to AGENTS.md"
          payoff_plan: "The owner commits or discards that worktree change; until then ROCS runs against uncommitted files"
        - id: "PIM-D-003"
          statement: "The committed AGENTS.md, governance/README.md and next_session_prompt.md still name governance/work-items.json as the work queue, although the repo is registered in AK"
          payoff_plan: "Settle with PIM-D-002; the worktree work-items.json is already an AK projection"
